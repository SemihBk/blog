<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Écran de verrouillage Windows</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        position: relative;
      }

      .lockscreen {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-image: url("https://images.unsplash.com/photo-1557683316-973673baf926?w=1920&q=80");
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .lockscreen::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
      }

      .top-section {
        padding: 40px;
        z-index: 1;
      }

      .date-time {
        color: white;
        text-align: left;
      }

      .time {
        font-size: 120px;
        font-weight: 300;
        line-height: 1;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .date {
        font-size: 28px;
        font-weight: 300;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      .bottom-section {
        padding: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 1;
      }

      .user-info {
        text-align: center;
        margin-bottom: 30px;
        opacity: 0;
        animation: fadeInUp 0.5s ease forwards;
        animation-delay: 0.3s;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: white;
        margin: 0 auto 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .username {
        color: white;
        font-size: 28px;
        font-weight: 400;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      .password-section {
        opacity: 0;
        animation: fadeInUp 0.5s ease forwards;
        animation-delay: 0.5s;
      }

      .password-container {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 15px 20px;
        min-width: 350px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: all 0.3s ease;
      }

      .password-container:focus-within {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }

      .password-container.error {
        animation: shake 0.5s ease;
        border-color: rgba(255, 100, 100, 0.8);
        background: rgba(255, 100, 100, 0.2);
      }

      .password-input {
        background: transparent;
        border: none;
        color: white;
        font-size: 16px;
        flex: 1;
        outline: none;
      }

      .password-input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .submit-btn {
        background: rgba(255, 255, 255, 0.3);
        border: none;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .submit-btn:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: translateX(3px);
      }

      .hint-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        margin-top: 15px;
        text-align: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      .error-message {
        color: #ff6b6b;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .error-message.show {
        opacity: 1;
      }

      .system-tray {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 20px;
        z-index: 1;
      }

      .icon-btn {
        width: 45px;
        height: 45px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
        font-size: 20px;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          transform: translateX(-10px);
        }
        20%,
        40%,
        60%,
        80% {
          transform: translateX(10px);
        }
      }

      .loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .loading.show {
        display: flex;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .time {
          font-size: 80px;
        }
        .date {
          font-size: 20px;
        }
        .password-container {
          min-width: 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="lockscreen">
      <div class="top-section">
        <div class="date-time">
          <div class="time" id="time">12:30</div>
          <div class="date" id="date">Mercredi 1 octobre</div>
        </div>
      </div>

      <div class="bottom-section">
        <div class="user-info">
          <div class="avatar">👤</div>
          <div class="username">Tshark</div>
        </div>

        <div class="password-section">
          <div class="password-container" id="passwordContainer">
            <input
              type="password"
              class="password-input"
              placeholder="Entrez votre mot de passe"
              id="passwordInput" />
            <button class="submit-btn" id="submitBtn">→</button>
          </div>
          <div class="error-message" id="errorMessage">
            Mot de passe incorrect
          </div>
          <div class="hint-text">Appuyez sur Entrée pour vous connecter</div>
        </div>
      </div>

      <div class="system-tray">
        <div class="icon-btn" title="Réseau">📶</div>
        <div class="icon-btn" title="Volume">🔊</div>
        <div class="icon-btn" title="Alimentation">⚡</div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <script>
      const CORRECT_PASSWORDS = [
        "fiat",
        "grandepunto",
        "fiatgrandepunto",
        "punto",
        "grandepunto",
        "fiatpunto",
        "fiatpunto",
      ];

      function updateTime() {
        const now = new Date();
        const timeEl = document.getElementById("time");
        const dateEl = document.getElementById("date");

        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        timeEl.textContent = `${hours}:${minutes}`;

        const options = { weekday: "long", day: "numeric", month: "long" };
        const dateStr = now.toLocaleDateString("fr-FR", options);
        dateEl.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
      }

      updateTime();
      setInterval(updateTime, 1000);

      const passwordInput = document.getElementById("passwordInput");
      const submitBtn = document.getElementById("submitBtn");
      const passwordContainer = document.getElementById("passwordContainer");
      const errorMessage = document.getElementById("errorMessage");
      const loading = document.getElementById("loading");

      function checkPassword() {
        const enteredPassword = passwordInput.value
          .toLowerCase()
          .replace(/\s+/g, "");

        if (CORRECT_PASSWORDS.includes(enteredPassword)) {
          // Mot de passe correct - afficher le chargement et rediriger
          loading.classList.add("show");
          setTimeout(() => {
            window.location.href =
              "/1e47c443-7483-41d6-93ad-7600c0b5e816/windows.html";
          }, 800);
        } else if (passwordInput.value.length > 0) {
          // Mot de passe incorrect - afficher l'erreur
          passwordContainer.classList.add("error");
          errorMessage.classList.add("show");

          setTimeout(() => {
            passwordContainer.classList.remove("error");
            errorMessage.classList.remove("show");
          }, 2000);

          passwordInput.value = "";
        }
      }

      submitBtn.addEventListener("click", checkPassword);

      passwordInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          checkPassword();
        }
      });

      // Masquer le message d'erreur quand l'utilisateur commence à taper
      passwordInput.addEventListener("input", () => {
        errorMessage.classList.remove("show");
      });
    </script>
  </body>
</html>
